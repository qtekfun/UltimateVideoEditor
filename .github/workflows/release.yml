name: Release build

# Builds the release APK and AAB (R8-minified). A `v<versionName>` tag publishes a GitHub Release with the signed
# APK, the AAB, SHA256SUMS.txt and the R8 mapping (a pre-release while the major version is 0). It needs the four
# UVEDITOR_* signing secrets (docs/RELEASE.md); a tagged build without them fails, so nothing unsigned is ever
# published. A manual run only builds and keeps the files as workflow artifacts (signed if the secrets exist).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # A tag must name the version in gradle/version.properties, so artifacts and tags cannot drift apart.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^versionName=//p' gradle/version.properties | tr -d '[:space:]')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version} in gradle/version.properties" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK platform, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing keystore
        env:
          UVEDITOR_KEYSTORE_BASE64: ${{ secrets.UVEDITOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UVEDITOR_KEYSTORE_BASE64" ]; then
            echo "$UVEDITOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "UVEDITOR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::A tagged release must be signed: set the UVEDITOR_* secrets (see docs/RELEASE.md)."; exit 1
          else
            echo "::warning::UVEDITOR_KEYSTORE_BASE64 is not set; this manual build stays unsigned."
          fi

      # The unit tests include OfflineGuaranteeTest, so a release can never ship a network permission or tracker.
      - name: Tests, lint and release build
        env:
          UVEDITOR_KEYSTORE_PASSWORD: ${{ secrets.UVEDITOR_KEYSTORE_PASSWORD }}
          UVEDITOR_KEY_ALIAS: ${{ secrets.UVEDITOR_KEY_ALIAS }}
          UVEDITOR_KEY_PASSWORD: ${{ secrets.UVEDITOR_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --console=plain --max-workers=4

      - name: Show the signing certificate
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)" || echo "unsigned build"

      - name: Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ultimatevideo-release-${{ github.ref_name }}
          path: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # The R8 mapping turns a minified stack trace back into readable names; keep it with the build.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ultimatevideo-r8-mapping-${{ github.ref_name }}
          path: dist/mapping.txt
          if-no-files-found: error
          retention-days: 30

      # Only a tag publishes: the GitHub Release carries the signed APK, the AAB, the checksums and the mapping.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^versionName=//p' gradle/version.properties | tr -d '[:space:]')"
          flags=""
          case "$version" in 0.*) flags="--prerelease" ;; esac
          cp dist/*.apk "dist/ultimateVE-${version}.apk"
          rm -f dist/app-release*.apk
          (cd dist && sha256sum "ultimateVE-${version}.apk" *.aab > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" "dist/ultimateVE-${version}.apk" dist/*.aab dist/SHA256SUMS.txt dist/mapping.txt \
            --target "$GITHUB_SHA" --title "ultimateVE ${version}" --generate-notes $flags
