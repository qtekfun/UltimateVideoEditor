name: Release build

# Builds the release APK and AAB (R8-minified) and keeps them as workflow artifacts. It needs no secrets: without
# a signing key the files are unsigned, which is enough to inspect, size-check and sign by hand. Nothing is
# published anywhere by this workflow.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Unsigned release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # A tag must name the version in gradle/version.properties, so artifacts and tags cannot drift apart.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^versionName=//p' gradle/version.properties | tr -d '[:space:]')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version} in gradle/version.properties" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK platform, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      # The unit tests include OfflineGuaranteeTest, so a release can never ship a network permission or tracker.
      - name: Tests, lint and release build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --console=plain --max-workers=4
        # Optional signing, only if the repository owner adds these four secrets. Without them the build stays unsigned.
        # env:
        #   UVEDITOR_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        #   UVEDITOR_KEYSTORE_PASSWORD: ${{ secrets.UVEDITOR_KEYSTORE_PASSWORD }}
        #   UVEDITOR_KEY_ALIAS: ${{ secrets.UVEDITOR_KEY_ALIAS }}
        #   UVEDITOR_KEY_PASSWORD: ${{ secrets.UVEDITOR_KEY_PASSWORD }}
        # (decode the keystore first: echo "${{ secrets.UVEDITOR_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks")

      - name: Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ultimatevideo-release-${{ github.ref_name }}
          path: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # The R8 mapping turns a minified stack trace back into readable names; keep it with the build.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ultimatevideo-r8-mapping-${{ github.ref_name }}
          path: dist/mapping.txt
          if-no-files-found: error
          retention-days: 30
