name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-host-tests:
    name: Native host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Pure-logic C++ built with the desktop toolchain: no NDK, no device.
      - name: Run scripts/run-native-tests.sh
        run: scripts/run-native-tests.sh

      # The audio core's lifetime rules under AddressSanitizer/UBSan and ThreadSanitizer (a use-after-free in the
      # audio callback crashed the app on a device).
      - name: Audio core under sanitizers
        env:
          UV_REQUIRE_SANITIZERS: "1"
        run: scripts/run-sanitizer-tests.sh

      - name: Build and run the CMake host tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          cmake -S app/src/main/cpp/tests -B build/uv-host -G Ninja
          cmake --build build/uv-host
          ctest --test-dir build/uv-host --output-on-failure

      # The device smoke runner's assertions (scripts/qa/check-export.py) must be able to fail: good and broken files made with ffmpeg.
      # The apt install can hang (a run was cancelled after an hour twice); fail fast so a re-run is cheap. The self-test needs ffmpeg, so this step cannot ignore a failure.
      - name: QA assertions self-test
        timeout-minutes: 10
        run: |
          # IPv4 only and short connection timeouts: the runner's IPv6 route to the mirror is what hangs.
          APT=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=2)
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get "${APT[@]}" update -qq && sudo timeout 240 apt-get "${APT[@]}" install -y -qq ffmpeg && break
            echo "apt attempt $attempt failed or hung"; [ "$attempt" = 3 ] && exit 1
          done
          scripts/qa/selftest.sh

  android:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK ($ANDROID_HOME) with sdkmanager; add what this project needs.
      - name: Install SDK platform, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v6

      # ffmpeg writes the PCM-in-MOV files that MovAudioScanTableTest scans (the test skips itself without it).
      # The apt mirror hangs now and then and a hung step cost an hour of CI; the test skips itself without ffmpeg, so a slow install is not fatal.
      - name: Install ffmpeg for the PCM sound-track scan test
        timeout-minutes: 5
        continue-on-error: true
        run: |
          APT=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::Retries=2)
          sudo apt-get "${APT[@]}" update -qq && sudo apt-get "${APT[@]}" install -y -qq ffmpeg

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain --max-workers=4

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ultimatevideo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
