# Weekly dependency updates, grouped so one week is a few pull requests rather than one per library.
# Every update goes through the normal CI (unit tests, native host tests, OfflineGuaranteeTest) and is reviewed:
# a bump must not add a permission, a network API or a new library (docs/PRIVACY.md), and THIRD_PARTY_NOTICES.md
# is updated when a notice changes.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "org.jetbrains.kotlin.plugin.*"
    ignore:
      # The SDK levels and the NDK are chosen on purpose (CLAUDE.md); AGP and Kotlin majors need a planned migration.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
